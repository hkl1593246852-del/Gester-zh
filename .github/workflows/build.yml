name: Build IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: alive
        run: |
          echo "ubuntu runner ok"
          uname -a

  build:
    runs-on: macos-14
    needs: probe
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Install ldid
        run: brew install ldid 2>/dev/null || brew install ProcursusTeam/ldid/ldid || true
      - name: Build
        run: |
          chmod +x build.sh
          export SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          ./build.sh
      - name: Verify
        run: |
          ls -la build/
          unzip -l build/*.ipa | grep -E "lproj" || true
      - uses: actions/upload-artifact@v4
        with:
          name: Gester-zh-ipa
          path: build/*.ipa
